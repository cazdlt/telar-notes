[project]
name = "telar-notes"
version = "0.1.0"
description = "Local-first Markdown editor"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
  "ty>=0.0.1a21,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--strict-config --strict-markers"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
